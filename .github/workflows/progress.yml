name: Update Progress Document

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run progress script
        run: |
          python scripts/progress/generate_progress.py

      - name: Commit and push changes to PROGRESS.md
        uses: EndBug/add-and-commit@v9
        with:
          add: "PROGRESS.md"
          message: "chore(progress): auto-update PROGRESS.md [skip ci]"
          default_author: github_actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
