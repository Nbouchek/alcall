name: alcall
description: A modern development environment setup tool
version: 0.1.0
license: MIT
repository:
  type: git
  url: https://github.com/yourusername/alcall.git
  branch: main

tools:
  required:
    docker: ">=20.10.0"
    kubectl: ">=1.20.0"
    helm: ">=3.7.0"
    terraform: ">=1.0.0"
    node: ">=16.0.0"
    python: ">=3.8.0"
    go: ">=1.16.0"
    rust: ">=1.56.0"
    gh: ">=2.0.0"
    yq: ">=4.0.0"

documentation:
  readme: "README.md"
  contributing: "CONTRIBUTING.md"
  issue_templates: true
  pr_template: true

github:
  workflows: true
  actions: true
  environments: true

directories:
  # Core service directories
  - services/auth-service
  - services/message-service
  - services/realtime-service
  - services/user-service
  - services/payment-service
  - services/ai-service
  - services/gateway-service

  # Web, mobile, and desktop applications
  - web/frontend
  - mobile/flutter
  - desktop/tauri

  # Infrastructure
  - infrastructure/terraform
  - infrastructure/terraform/modules
  - infrastructure/kubernetes
  - infrastructure/kubernetes/base
  - infrastructure/kubernetes/overlays
  - infrastructure/monitoring
  - infrastructure/monitoring/prometheus
  - infrastructure/monitoring/grafana
  - infrastructure/monitoring/alertmanager

  # Documentation
  - docs/api
  - docs/architecture
  - docs/development

  # GitHub workflows and templates
  - .github/workflows
  - .github/ISSUE_TEMPLATE
  - .github/PULL_REQUEST_TEMPLATE
  - .github/actions
  - .github/environments

  # CI/CD directories
  - scripts/cicd/docker
  - scripts/cicd/kubernetes
  - scripts/cicd/github

  # Logs and reports
  - logs/test
  - logs/dev-env
  - logs/repo
  - logs/infra
  - logs/cicd
  - reports/test

  # Configuration
  - config

  # Documentation
  - documentation
