version: "3.8"

services:
  janus:
    image: ubuntu:20.04
    container_name: unifiedchat-janus
    ports:
      - "8088:8088" # HTTP API
      - "8089:8089" # WebSocket API
      - "8000:8000" # WebRTC (HTTP)
      - "10000-10200:10000-10200/udp" # WebRTC (UDP)
    environment:
      - JANUS_LOG_LEVEL=4
      - JANUS_LOG_TIMESTAMPS=true
    command: >
      bash -c "
      apt-get update && apt-get install -y janus janus-plugins curl &&
      mkdir -p /opt/janus/etc/janus &&
      echo 'general: { enabled = true, sampling_rate = 48000, opus_bitrate = 32000 }' > /opt/janus/etc/janus/janus.plugin.audiobridge.jcfg &&
      echo 'general: { base_path = \"/janus\" }' > /opt/janus/etc/janus/janus.transport.http.jcfg &&
      echo 'general: { enabled = true }' > /opt/janus/etc/janus/janus.transport.websockets.jcfg &&
      janus -F /opt/janus/etc/janus -L 4 -d 5
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/janus/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: TURN server for better connectivity
  coturn:
    image: coturn/coturn:latest
    container_name: unifiedchat-turn
    ports:
      - "3478:3478" # TURN TCP
      - "3478:3478/udp" # TURN UDP
      - "5349:5349" # TURN TLS
      - "5349:5349/udp" # TURN TLS UDP
    environment:
      - TURN_USERNAME=unifiedchat
      - TURN_PASSWORD=unifiedchat123
      - TURN_REALM=unifiedchat.com
      - TURN_NO_TLS=1
      - TURN_NO_TCP=1
    command: >
      --listening-port=3478
      --tls-listening-port=5349
      --listening-ip=0.0.0.0
      --external-ip=0.0.0.0
      --realm=unifiedchat.com
      --user=unifiedchat:unifiedchat123
      --no-tls
      --no-tcp
      --log-file=stdout
      --verbose
    restart: unless-stopped
    depends_on:
      - janus

networks:
  default:
    name: unifiedchat-network
