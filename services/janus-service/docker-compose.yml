version: "3.8"

services:
  janus:
    image: meetecho/janus-gateway:latest
    container_name: unifiedchat-janus
    ports:
      - "8088:8088"
      - "8089:8089"
      - "8000:8000"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./config:/opt/janus/etc/janus
    environment:
      - JANUS_LOG_LEVEL=4
      - JANUS_LOG_TIMESTAMPS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/janus/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: TURN server for better connectivity
  coturn:
    image: coturn/coturn:latest
    container_name: unifiedchat-turn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    environment:
      - TURN_USERNAME=unifiedchat
      - TURN_PASSWORD=changeme
    restart: unless-stopped
    depends_on:
      - janus

networks:
  default:
    name: unifiedchat-network
