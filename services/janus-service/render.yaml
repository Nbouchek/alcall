services:
  - type: web
    name: unifiedchat-janus-service
    runtime: docker
    region: oregon
    plan: starter
    envVars:
      - key: JANUS_LOG_LEVEL
        value: "4"
      - key: JANUS_LOG_TIMESTAMPS
        value: "true"
      - key: PORT
        value: "8088" # HTTP API port; Render will also expose 443 for WSS

    autoDeploy: true
    numInstances: 1
# Note: Render will route HTTPS/WSS traffic to port 443 automatically
