services:
  - type: web
    name: unifiedchat-janus-service
    runtime: docker
    region: oregon
    plan: standard  # Upgrade from starter for better resources
    envVars:
      - key: JANUS_LOG_LEVEL
        value: "4"
      - key: JANUS_LOG_TIMESTAMPS
        value: "true"
      - key: JANUS_HTTP_PORT
        value: "8088"
      - key: PORT
        value: "8088"
    autoDeploy: true
    numInstances: 1