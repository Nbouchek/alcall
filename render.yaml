services:
  - type: web
    name: unifiedchat-frontend
    env: docker
    dockerfilePath: ./web/frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://unifiedchat-api.onrender.com
    routes:
      - type: rewrite
        source: /
        destination: /index.html

  - type: web
    name: unifiedchat-auth
    env: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8082

  - type: web
    name: unifiedchat-message
    env: docker
    dockerfilePath: ./services/message-service/Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        value: unifiedchat-postgres
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: unifiedchat
      - key: DB_USER
        value: unifiedchat
      - key: DB_PASSWORD
        generateValue: true
      - key: PORT
        value: 8083

  - type: pserv
    name: unifiedchat-postgres
    env: docker
    image: postgres:15
    envVars:
      - key: POSTGRES_DB
        value: unifiedchat
      - key: POSTGRES_USER
        value: unifiedchat
      - key: POSTGRES_PASSWORD
        generateValue: true
