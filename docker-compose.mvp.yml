services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: unifiedchat
      POSTGRES_USER: unifiedchat
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifiedchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Janus WebRTC Server for audio calling
  janus:
    build: ./services/janus-service
    container_name: unifiedchat-janus
    ports:
      - "8090:8090" # HTTP API
      - "8088:8088" # HTTP API (alternative)
      - "8089:8089" # WebSocket API
      - "8188:8188" # WebSocket API (alternative)
      - "8000:8000" # WebRTC
      - "10000-10200:10000-10200/udp" # RTP/RTCP ports
    volumes:
      - ./services/janus-service/config:/opt/janus/etc/janus
    environment:
      - JANUS_LOG_LEVEL=4
      - JANUS_LOG_TIMESTAMPS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/janus/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # TURN server for better connectivity
  coturn:
    image: coturn/coturn:latest
    container_name: unifiedchat-turn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    environment:
      - TURN_USERNAME=unifiedchat
      - TURN_PASSWORD=changeme
    restart: unless-stopped
    depends_on:
      - janus

  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unifiedchat
      DB_USER: unifiedchat
      DB_PASSWORD: password123
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build: ./services/auth-service
    ports:
      - "8082:8082"
    depends_on:
      user-service:
        condition: service_healthy
    environment:
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  message-service:
    build: ./services/message-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unifiedchat
      DB_USER: unifiedchat
      DB_PASSWORD: password123
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8083/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime-service:
    build: ./services/realtime-service
    ports:
      - "8084:8084"
    depends_on:
      message-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8084/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway-service:
    build: ./services/gateway-service
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8081
      MESSAGE_SERVICE_URL: http://message-service:8083
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./web/frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_healthy
      janus:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8084
      NEXT_PUBLIC_JANUS_URL: ws://localhost:8089
      NEXT_PUBLIC_JANUS_HTTP_URL: http://localhost:8090

volumes:
  postgres_data:
