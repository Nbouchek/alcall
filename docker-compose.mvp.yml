version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: unifiedchat-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: unifiedchat-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  unifiedchat-janus-service:
    image: canyan/janus-gateway:master
    platform: linux/amd64
    container_name: unifiedchat-janus-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8188:8188"
      - "8088:8088"
    volumes:
      - ./config:/opt/janus/etc/janus
      - janus_logs:/var/log/janus
      - janus_data:/var/lib/janus
    environment:
      - JANUS_HTTP_PORT=8088
      - STUN_SERVER=stun.l.google.com
      - STUN_PORT=19302
      - DEBUG_LEVEL=4
      - DEBUG_COLORS=true
      - WEBSOCKETS_ENABLED=true
      - HTTP_ENABLED=true
      - JANUS_TURN_USERNAME=${JANUS_TURN_USERNAME:-}
      - JANUS_TURN_PASSWORD=${JANUS_TURN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/janus/info || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    user: root
    networks:
      - backend

  unifiedchat-user-service:
    build:
      context: ./services/user-service
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unifiedchat
      DB_USER: unifiedchat
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8081/health"
      interval: 30s
      timeout: 10s
      retries: 3

  unifiedchat-auth-service:
    build: ./services/auth-service
    container_name: unifiedchat-auth-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - backend
    depends_on:
      unifiedchat-user-service:
        condition: service_healthy
    environment:
      JWT_SECRET: ${AUTH_SERVICE_JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unifiedchat
      DB_USER: unifiedchat
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8082/health"
      interval: 30s
      timeout: 10s
      retries: 3

  unifiedchat-message-service:
    build: ./services/message-service
    container_name: unifiedchat-message-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8083:8083"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      unifiedchat-realtime-service:
        condition: service_started
    environment:
      POSTGRES_DSN: "host=postgres user=unifiedchat password=${POSTGRES_PASSWORD} dbname=unifiedchat port=5432 sslmode=disable"
      REALTIME_SERVICE_URL: http://unifiedchat-realtime-service:8084
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8083/health"
      interval: 30s
      timeout: 10s
      retries: 3

  unifiedchat-realtime-service:
    build: ./services/realtime-service
    container_name: unifiedchat-realtime-service
    hostname: unifiedchat-realtime-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8084:8084"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "host=postgres user=unifiedchat password=${POSTGRES_PASSWORD} dbname=unifiedchat port=5432 sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8084/health | grep OK"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  unifiedchat-gateway-service:
    build: ./services/gateway-service
    container_name: unifiedchat-gateway-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      unifiedchat-auth-service:
        condition: service_healthy
      unifiedchat-user-service:
        condition: service_healthy
      unifiedchat-message-service:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://unifiedchat-auth-service:8082
      USER_SERVICE_URL: http://unifiedchat-user-service:8081
      MESSAGE_SERVICE_URL: http://unifiedchat-message-service:8083
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8080/health"
      interval: 30s
      timeout: 10s
      retries: 3

  unifiedchat-frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: unifiedchat-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_MESSAGE_API_URL: ${NEXT_PUBLIC_MESSAGE_API_URL}
      NEXT_PUBLIC_REALTIME_API_URL: ${NEXT_PUBLIC_REALTIME_API_URL}
      NEXT_PUBLIC_REALTIME_HTTP_API_URL: ${NEXT_PUBLIC_REALTIME_HTTP_API_URL}
      NEXT_PUBLIC_JANUS_URL: ${NEXT_PUBLIC_JANUS_URL}
      NEXT_PUBLIC_JANUS_HTTP_URL: ${NEXT_PUBLIC_JANUS_HTTP_URL}
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      unifiedchat-auth-service:
        condition: service_healthy
      unifiedchat-message-service:
        condition: service_healthy
      unifiedchat-realtime-service:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  janus_logs:
  janus_data:
